<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard de TI Brasil 2025</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- ===== CABEÇALHO ===== -->
  <header>
    <h1>Dashboard de TI - Brasil 2025</h1>
    <p>Análise do mercado de tecnologia no Brasil</p>
  </header>

  <main>

    <!-- ===== FILTROS ===== -->
    <section id="filtros">
      <select id="area">
        <option value="todas">Todas as áreas</option>
        <option value="Cibersegurança">Cibersegurança</option>
        <option value="Cloud">Cloud</option>
        <option value="IA">IA</option>
        <option value="Web">Web</option>
        <option value="Dados">Dados</option>
        <option value="DevOps">DevOps</option>
      </select>

      <select id="regiao">
        <option value="todas">Todas as regiões</option>
        <option value="Sudeste">Sudeste</option>
        <option value="Sul">Sul</option>
        <option value="Nordeste">Nordeste</option>
        <option value="Centro-Oeste">Centro-Oeste</option>
        <option value="Norte">Norte</option>
      </select>

      <button id="reset">Redefinir</button>
    </section>

    <!-- ===== CARDS ===== -->
    <section class="cards">
      <div class="card">
        <h3>Vagas em TI</h3>
        <p id="vagas">--</p>
      </div>

      <div class="card">
        <h3>Crescimento do Setor</h3>
        <p id="crescimento">--</p>
      </div>

      <div class="card">
        <h3>Salário Médio</h3>
        <p id="salario">--</p>
      </div>
    </section>

    <!-- ===== GRÁFICOS ===== -->
    <section class="charts">
      <div class="chart-container"><canvas id="pieChart"></canvas></div>
      <div class="chart-container"><canvas id="barChart"></canvas></div>
      <div class="chart-container"><canvas id="salaryChart"></canvas></div>
      <div class="chart-container"><canvas id="graficoLinguagens"></canvas></div>
      <div class="chart-container"><canvas id="graficoRegioes"></canvas></div>
      <div class="chart-container"><canvas id="graficoAreas"></canvas></div>
    </section>

  </main>

  <!-- ===== RODAPÉ ===== -->
  <footer>
    <p>© 2025 Dashboard de TI Brasil - Desenvolvido por Adriely</p>
  </footer>

  <!-- SCRIPT -->
  <script src="script.js"></script>
</body>
</html>
